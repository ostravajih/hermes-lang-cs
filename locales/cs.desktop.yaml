settings.fieldDescriptions.browser.useRealProfile: "Místní prohlížení používá vaše skutečná přihlášení. Hermes zkopíruje profil vašeho výchozího prohlížeče (cookies, přihlášení, předvolby) do spravovaného snímku a ovládá jej pomocí přibaleného Chromia — váš aktivní profil se nikdy neotevře přímo a kopie se při každém spuštění znovu aktualizuje podle něj. Agentovi také umožňuje na vyžádání otevřít místní relaci se skutečným profilem, i když je nakonfigurován cloudový backend prohlížeče. Podporovány jsou pouze prohlížeče Chromium (Chrome, Edge, Brave, Brave Origin, Chromium); pokud je jako výchozí nastaven jiný prohlížeč než Chromium, zobrazí se srozumitelná chyba. Ve výchozím nastavení je tato možnost vypnutá."
