sharedMetrics.sendDesc: "Nahrávat každý denní balíček do telemetrické služby Nous. Odesílají se jen data z okna souhlasu. Vyžaduje zapnutý sběr."
sharedMetrics.sendLabel: "Odesílat statistiky používání do Nous"
sharedMetrics.sending: "Statistiky zůstávají v tomto počítači, dokud nezvolíte Sdílet. Sdílené statistiky se odesílají Nous jednou denně s náhodným ID tohoto profilu. Kromě jednorázové informace o instalaci Hermese, započtené až po vašem souhlasu, se statistiky z doby před souhlasem nikdy neodesílají. Kdykoli to můžete změnit v Nastavení."
