sharedMetrics.collectedActivity: "Aktivita, délka relací, výsledky a kategorie chyb, včetně důvodu z pevně daného seznamu při odmítnutí, selhání nebo přeskočení zápisu do paměti či komprese kontextu."
sharedMetrics.collectedMachine: "Orientační údaje o počítači: rozsah RAM, typ GPU, stáří verze Hermes a kanál vydání, počet chybějících aktualizací, zda se používá místní server modelů"
sharedMetrics.collectedMilestones: "Počty související s nastavením, seskupené do pásem"
sharedMetrics.collectedModels: "Směrování modelů a celkové počty tokenů"
sharedMetrics.collectedNames: "Názvy vestavěných nástrojů, příkazů a katalogů"
sharedMetrics.collectedReliability: "Výsledky a časové údaje aktualizací a instalací (při selhání také důvod z pevně daného seznamu a fáze, ve které k němu došlo; včetně záznamu nové instalace na tomto počítači, který se započítá až po vašem souhlasu), pády, rychlost spuštění a odpovědí a stav platforem pro zasílání zpráv"
sharedMetrics.collectedUsage: "Jak se Hermes používá: přesnost a efektivita agenta (shody při úpravách, smyčky, obnovení, tokeny a volání nástrojů na úlohu, narušení cache), aktivní čas podle rozhraní a režimu Desktop, používání jednotlivých částí aplikace, akcí a nastavení, jejich rychlé zavírání či vypínání a výsledky nastavení poskytovatelů"
sharedMetrics.consentBody: "Sdílené metriky obsahují jen omezené čítače. Nikdy prompty, soubory, cesty ani text chyb. Sběr probíhá lokálně. Jejich odesílání do Nous je samostatný souhlas."
sharedMetrics.consentTitle: "Chcete pomoci vylepšit Hermes?"
